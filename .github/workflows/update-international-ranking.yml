name: Update international rankings

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC -- 1h after update-db.yml's 05:00 UTC run
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No scrape/build_db.py here -- this workflow only re-ranks whatever
      # athletics.db update-db.yml already committed an hour earlier (same
      # weekly cadence, offset so this always sees that run's fresh data).
      # World/Europe ranking needs many worldathletics.org requests per
      # discipline (slow -- the whole reason it's a separate workflow from
      # the cheap has.hr-only national ranking, run in update-db.yml).
      - name: Update world/European rankings (current season)
        run: python wa_ranking.py --scope international

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add athletics.db wa_ranking_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "International rankings refresh"
            git push
          else
            echo "No changes, skipping commit."
          fi
