<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete career — Athletics DB</title>
<link href="../css/bootstrap.min.css" rel="stylesheet">
<script src="../js/jquery-3.6.1.min.js"></script>
<script src="../js/datatables.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/render-table.js"></script>
<script src="../js/data-cache.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div id="navbar"></div>

<div class="p-3 m-0 border-0">
  <div class="row mb-3">
    <div class="input-group mb-1 autocomplete">
      <span class="input-group-text">Athlete name:</span>
      <input type="text" class="form-control autocomplete" id="athleteNameInput" placeholder="Type a name...">
      <button id="athleteSearchBtn" type="button" class="btn btn-outline-secondary" style="display:none;">Search</button>
    </div>
    <ul id="athleteMatchList" class="list-group mb-3" style="display:none; max-height:220px; overflow-y:auto;"></ul>
    <div class="col" id="buttons">
      <button id="getDataButton" type="button" class="btn btn-outline-primary" disabled>Get Data</button>
    </div>
  </div>

  <div class="row mb-3">
    <div class="d-flex justify-content-center">
      <div id="spinner" class="spinner-border text-primary" role="status" style="display:none;">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
  </div>

  <div id="resultArea" style="display:none;">
    <div class="row mb-3">
      <div class="col-auto">
        <label class="form-label">Discipline
          <select id="disciplineSelect" class="form-select"></select>
        </label>
      </div>
    </div>
    <canvas id="progressionChart" height="90"></canvas>
    <div class="row mt-3">
      <div class="col">
        <div id="DataTableDiv" class="table-responsive-sm"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { setupSearch } from "../js/search-input.js";

$(function () {
  $("#navbar").load("../templates/navbar.html", function () {
    $("#athleteCareerNav").first().addClass("active");
  });
});

let athleteId = null;
let athleteResults = [];
let chart = null;

const COLUMNS = [
  { field: "year", label: "Year" },
  { field: "discipline", label: "Discipline" },
  { field: "mark", label: "Mark" },
  { field: "date", label: "Date" },
  { field: "city", label: "City" },
  { field: "agegroup", label: "Age group" },
  { field: "rank", label: "Rank" },
  { field: "club", label: "Club" },
  { field: "wa_points", label: "WA pts" },
];

async function loadCareer() {
  if (!athleteId) return;
  $("#spinner").show();
  try {
    const res = await fetch(`${API_BASE_URL}/athletes/${athleteId}/career`);
    const data = await res.json();
    athleteResults = data.results;
    $("#resultArea").show();
    renderDataTable(athleteResults, COLUMNS);
    populateDisciplines();
  } finally {
    $("#spinner").hide();
  }
}

function populateDisciplines() {
  const disciplines = [...new Set(athleteResults.map(r => r.discipline))].sort();
  const select = document.getElementById("disciplineSelect");
  select.innerHTML = disciplines.map(d => `<option value="${d}">${d}</option>`).join("");
  if (disciplines.length) renderChart(disciplines[0]);
}

function renderChart(discipline) {
  const points = athleteResults
    .filter(r => r.discipline === discipline && r.mark_value != null)
    .sort((a, b) => (a.date ?? "").localeCompare(b.date ?? ""));

  const ctx = document.getElementById("progressionChart");
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: points.map(p => p.date),
      datasets: [{ label: discipline, data: points.map(p => p.mark_value), borderColor: "#2563eb", tension: 0.2 }],
    },
    options: { responsive: true, scales: { y: { title: { display: true, text: "mark value" } } } },
  });
}

document.getElementById("disciplineSelect").addEventListener("change", e => renderChart(e.target.value));
document.getElementById("getDataButton").addEventListener("click", loadCareer);

getCachedList("athletes", `${API_BASE_URL}/athletes/list`).then(athletes => {
  setupSearch({
    inputId: "athleteNameInput",
    buttonId: "athleteSearchBtn",
    matchListId: "athleteMatchList",
    items: athletes,
    valueField: "id",
    onSelect: (item) => {
      athleteId = item.value;
      document.getElementById("getDataButton").disabled = false;
    },
  });
});
</script>
<script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
