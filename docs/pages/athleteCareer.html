<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete career — Athletics DB</title>
<link href="../css/bootstrap.min.css" rel="stylesheet">
<script src="../js/jquery-3.6.1.min.js"></script>
<script src="../js/datatables.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/render-table.js"></script>
<script src="../js/data-cache.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div id="navbar"></div>

<div class="p-3 m-0 border-0">
  <div class="row mb-3">
    <div class="input-group mb-1 autocomplete">
      <span class="input-group-text">Athlete name:</span>
      <input type="text" class="form-control autocomplete" id="athleteNameInput" placeholder="Type a name...">
      <button id="athleteSearchBtn" type="button" class="btn btn-outline-secondary" style="display:none;">Search</button>
    </div>
    <ul id="athleteMatchList" class="list-group mb-3" style="display:none; max-height:220px; overflow-y:auto;"></ul>
    <div class="col" id="buttons">
      <button id="getDataButton" type="button" class="btn btn-outline-primary" disabled>Get Data</button>
    </div>
  </div>

  <div class="row mb-3">
    <div class="d-flex justify-content-center">
      <div id="spinner" class="spinner-border text-primary" role="status" style="display:none;">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
  </div>

  <div id="resultArea" style="display:none;">
    <div class="row mb-3">
      <div class="col-auto">
        <label class="form-label">Discipline
          <select id="disciplineSelect" class="form-select"></select>
        </label>
      </div>
    </div>
    <canvas id="progressionChart" height="90"></canvas>
    <div class="row mt-3">
      <div class="col">
        <div id="DataTableDiv" class="table-responsive-sm"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { setupSearch } from "../js/search-input.js";

$(function () {
  $("#navbar").load("../templates/navbar.html", function () {
    $("#athleteCareerNav").first().addClass("active");
  });
});

let athleteId = null;
let athleteResults = [];
let chart = null;

async function loadCareer() {
  if (!athleteId) return;
  $("#spinner").show();
  try {
    const res = await fetch(`${API_BASE_URL}/athletes/${athleteId}/career`);
    const data = await res.json();
    athleteResults = data.results;
    $("#resultArea").show();
    renderProgressionTable(athleteResults);
    populateDisciplines();
  } finally {
    $("#spinner").hide();
  }
}

function disciplineLabel(discipline, indoor) {
  return indoor ? `${discipline} (dvorana)` : discipline;
}

// One row per discipline, one column per year -- cell is that year's best
// mark (a discipline can have many races in a season; the season-best per
// (discipline, year) and the all-time PB are both computed client-side here
// from mark_value + higher_is_better, since the API now returns every race
// rather than flagging a single season-best row) -- plus PB/PB Year/WA pts
// columns, mirroring the old backend's GetAthleteCarrer pivot instead of a
// flat one-row-per-race list.
function renderProgressionTable(results) {
  const individual = results.filter(r => r.mark_value != null);
  const years = [...new Set(individual.map(r => r.year))].sort((a, b) => a - b);

  const disciplines = new Map(); // "name||indoor" -> { label, higherIsBetter, byYear }
  for (const r of individual) {
    const key = `${r.discipline}||${r.indoor}`;
    if (!disciplines.has(key)) {
      disciplines.set(key, {
        label: disciplineLabel(r.discipline, r.indoor),
        higherIsBetter: !!r.higher_is_better,
        byYear: new Map(),
      });
    }
    const d = disciplines.get(key);
    const current = d.byYear.get(r.year);
    const better = !current ||
      (d.higherIsBetter ? r.mark_value > current.mark_value : r.mark_value < current.mark_value);
    if (better) d.byYear.set(r.year, r);
  }

  // Disciplines with the most years of data show first (the athlete's main
  // events ahead of one-off/occasional ones); ties fall back to alphabetical.
  const rows = [...disciplines.values()].sort((a, b) => {
    if (b.byYear.size !== a.byYear.size) return b.byYear.size - a.byYear.size;
    return a.label.localeCompare(b.label);
  });
  for (const d of rows) {
    d.pb = [...d.byYear.values()].reduce((best, r) => {
      if (!best) return r;
      const better = d.higherIsBetter ? r.mark_value > best.mark_value : r.mark_value < best.mark_value;
      return better ? r : best;
    }, null);
  }

  const ALL_RANK_COLUMNS = [
    ["national_rank_senior", "National rank (senior)"],
    ["national_rank_u23", "National rank (U23)"],
    ["national_rank_u20", "National rank (U20)"],
    ["national_rank_u18", "National rank (U18)"],
    ["national_rank_u16", "National rank (U16)"],
    ["national_rank_u14", "National rank (U14)"],
    ["world_rank_senior", "World rank (senior)"],
    ["world_rank_u23", "World rank (U23)"],
    ["world_rank_u20", "World rank (U20)"],
    ["world_rank_u18", "World rank (U18)"],
    ["europe_rank_senior", "Europe rank (senior)"],
    ["europe_rank_u23", "Europe rank (U23)"],
    ["europe_rank_u20", "Europe rank (U20)"],
    ["europe_rank_u18", "Europe rank (U18)"],
  ];

  // Most rank columns are NULL for most athletes (e.g. world/europe ranks
  // only ever get filled in once an athlete's mark clears the WA presence
  // gate -- see wa_ranking.py's module docstring). Rather than showing 14
  // mostly-empty columns, keep only the ones where at least one discipline's
  // PB actually has a value.
  const RANK_COLUMNS = ALL_RANK_COLUMNS.filter(([field]) =>
    rows.some(d => d.pb && d.pb[field] != null)
  );

  const thead = ["Discipline", ...years, "PB", "PB Year", "WA pts", ...RANK_COLUMNS.map(c => c[1])]
    .map(h => `<th class="text-center">${h}</th>`).join("");
  const tbody = rows.map(d => {
    const yearCells = years.map(y => {
      const r = d.byYear.get(y);
      return `<td class="text-center">${r ? r.mark : "-"}</td>`;
    }).join("");
    const pb = d.pb;
    const rankCells = RANK_COLUMNS.map(([field]) =>
      `<td class="text-center">${pb && pb[field] != null ? pb[field] : "-"}</td>`
    ).join("");
    return `<tr>
      <td class="text-center">${d.label}</td>
      ${yearCells}
      <td class="text-center">${pb ? pb.mark : "-"}</td>
      <td class="text-center">${pb ? pb.year : "-"}</td>
      <td class="text-center">${pb && pb.wa_points != null ? pb.wa_points : "-"}</td>
      ${rankCells}
    </tr>`;
  }).join("");

  $("#DataTableDiv").empty();
  $(".buttons-excel").remove();
  $("#DataTableDiv").append(
    `<table id="DataTable" class="table table-bordered table-striped border-dark table-primary">
       <thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody>
     </table>`
  );
  // order=[] keeps the "most years first" row order we just built instead
  // of DataTables silently re-sorting column 0 (Discipline) alphabetically
  // on load -- see render-table.js's initDataTable.
  initDataTable([]);
}

// Plain discipline-name -> distinct-year count (indoor/outdoor merged,
// unlike renderProgressionTable's per-discipline rows -- this feeds the
// chart's discipline dropdown, and renderChart itself filters by discipline
// name only, so counting years the same way keeps the two consistent).
function disciplineYearCounts(results) {
  const yearsByDiscipline = new Map();
  for (const r of results) {
    if (r.mark_value == null) continue;
    if (!yearsByDiscipline.has(r.discipline)) yearsByDiscipline.set(r.discipline, new Set());
    yearsByDiscipline.get(r.discipline).add(r.year);
  }
  return new Map([...yearsByDiscipline].map(([d, years]) => [d, years.size]));
}

function populateDisciplines() {
  const yearCounts = disciplineYearCounts(athleteResults);
  // Same "most years first" ordering as the table below -- this dropdown is
  // the first thing next to the chart, so it needs to match, and defaulting
  // the chart to disciplines[0] now means it opens on the athlete's most
  // established event instead of whatever sorts first alphabetically.
  const disciplines = [...new Set(athleteResults.map(r => r.discipline))].sort((a, b) => {
    const yearsA = yearCounts.get(a) ?? 0;
    const yearsB = yearCounts.get(b) ?? 0;
    if (yearsB !== yearsA) return yearsB - yearsA;
    return a.localeCompare(b);
  });
  const select = document.getElementById("disciplineSelect");
  select.innerHTML = disciplines.map(d => `<option value="${d}">${d}</option>`).join("");
  if (disciplines.length) renderChart(disciplines[0]);
}

// Formats a raw mark_value (seconds) as has.hr-style time text -- "M:SS,ss"
// once a mark passes 60 seconds (800m and up naturally clear that even at a
// jog), escalating to "H:MM:SS,ss" past an hour so road-running distances
// (10km, half marathon, marathon) format correctly too -- e.g. 125.3 ->
// "2:05,30", 9000 -> "2:30:00,00". Sprints/hurdles stay plain seconds,
// matching how has.hr's own tables only switch to time formatting once a
// mark passes a minute (see parse_tables.normalize_mark).
function formatMarkValue(value) {
  if (value < 60) return value.toFixed(2).replace(".", ",");
  const totalMinutes = Math.floor(value / 60);
  const seconds = (value - totalMinutes * 60).toFixed(2).padStart(5, "0").replace(".", ",");
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours > 0) return `${hours}:${String(minutes).padStart(2, "0")}:${seconds}`;
  return `${minutes}:${seconds}`;
}

function renderChart(discipline) {
  const points = athleteResults
    .filter(r => r.discipline === discipline && r.mark_value != null)
    .sort((a, b) => (a.date ?? "").localeCompare(b.date ?? ""));

  // Field events (throws/jumps) already put the biggest -- best -- number at
  // the top of a normal ascending axis. Track events are the opposite (a
  // SMALLER time is better), so the axis needs reversing for those, to keep
  // "up the chart" meaning "improving" regardless of event type.
  const higherIsBetter = !!(points[0] && points[0].higher_is_better);

  // Find the PB point (the single best mark in this discipline's whole
  // progression, not just this year -- points already spans every year) so
  // it can be drawn as a distinct highlighted dot instead of blending into
  // the rest of the line.
  const pbIndex = points.reduce((bestIdx, p, i, arr) => {
    if (bestIdx === -1) return i;
    const better = higherIsBetter ? p.mark_value > arr[bestIdx].mark_value : p.mark_value < arr[bestIdx].mark_value;
    return better ? i : bestIdx;
  }, -1);
  const pointColors = points.map((_, i) => (i === pbIndex ? "#dc2626" : "#2563eb"));
  const pointRadii = points.map((_, i) => (i === pbIndex ? 7 : 3));

  const ctx = document.getElementById("progressionChart");
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: points.map(p => p.date),
      datasets: [{
        label: discipline,
        data: points.map(p => p.mark_value),
        borderColor: "#2563eb",
        tension: 0.2,
        pointBackgroundColor: pointColors,
        pointBorderColor: pointColors,
        pointRadius: pointRadii,
        pointHoverRadius: pointRadii.map(r => r + 2),
      }],
    },
    options: {
      responsive: true,
      scales: {
        y: {
          title: { display: true, text: "mark value" },
          reverse: !higherIsBetter,
          ticks: { callback: (value) => (higherIsBetter ? value : formatMarkValue(value)) },
        },
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const formatted = higherIsBetter ? ctx.parsed.y : formatMarkValue(ctx.parsed.y);
              return `${discipline}: ${formatted}${ctx.dataIndex === pbIndex ? " (PB)" : ""}`;
            },
          },
        },
      },
    },
  });
}

document.getElementById("disciplineSelect").addEventListener("change", e => renderChart(e.target.value));
document.getElementById("getDataButton").addEventListener("click", loadCareer);

getCachedList("athletes", `${API_BASE_URL}/athletes/list`).then(athletes => {
  setupSearch({
    inputId: "athleteNameInput",
    buttonId: "athleteSearchBtn",
    matchListId: "athleteMatchList",
    items: athletes,
    valueField: "id",
    onSelect: (item) => {
      athleteId = item.value;
      document.getElementById("getDataButton").disabled = false;
    },
  });
});
</script>
<script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
